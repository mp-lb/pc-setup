# Curated portable preferences, not a dump of a machine's settings.
# Paths are relative to /org/gnome/. Wallpaper URIs are set at install time.

[desktop/interface]
accent-color='blue'
color-scheme='prefer-dark'
gtk-theme='Yaru-blue-dark'
icon-theme='Yaru-blue-dark'

[desktop/background]
color-shading-type='solid'
picture-options='zoom'
primary-color='#000000000000'
secondary-color='#000000000000'

[desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
primary-color='#000000000000'
secondary-color='#000000000000'

[shell/extensions/dash-to-dock]
always-center-icons=true
background-opacity=1.0
click-action='focus-minimize-or-appspread'
dash-max-icon-size=24
dock-fixed=true
dock-position='BOTTOM'
extend-height=true
multi-monitor=true
show-apps-always-in-the-edge=false
show-trash=false
transparency-mode='FIXED'

[shell/extensions/ding]
show-home=false
show-trash=false
show-volumes=false
show-network-volumes=false
